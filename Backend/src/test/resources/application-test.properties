# Test configuration for JWT
jwt.secret=testsecretkeytestsecretkeytestsecretkeytestsecretkey
jwt.expiration=86400000

# Test database configuration
spring.datasource.url=jdbc:h2:mem:bobgourmet-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway migrations for tests
spring.flyway.enabled=false

# Test logging
logging.level.com.example.BobGourmet=DEBUG

# CORS for tests
cors.allowed-origins=http://localhost:3000,http://localhost:5173
oauth.frontend.base-url=http://localhost:5173

# Email configuration for tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# App email configuration
app.mail.from=test@bobgourmet.com
app.frontend.url=http://localhost:5173

# Legacy web/security tests use this fallback; isolated integration tests override it
# with a Testcontainers @ServiceConnection (not an embedded or shared local Redis).
spring.data.redis.url=redis://localhost:6379
spring.redis.clear-on-startup=false

# OAuth2 test configuration
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# IP Tracking configuration for tests
app.security.ip-tracking.redis-key-prefix=test:ip:
app.security.ip-tracking.email-key-prefix=test:email:
app.security.ip-tracking.max-attempts-per-ip=10
app.security.ip-tracking.tracking-duration-hours=1
app.security.ip-tracking.email-block-duration-days=1

# Email verification configuration for tests
app.email.pre-verification.token-key-prefix=test:token:
app.email.pre-verification.email-key-prefix=test:email:
app.email.pre-verification.token-ttl-hours=1
app.email.pre-verification.verified-ttl-hours=24

# Email domain validation
app.email.allowed-domains=gmail.com,test.com
